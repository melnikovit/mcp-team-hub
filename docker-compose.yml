      DATABASE_URL: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-mcp_admin}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:4300}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4300}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-changeme}
      ORCHESTRATOR_URL: http://orchestrator:8090
      ORCHESTRATOR_API_TOKEN: ${ORCHESTRATOR_API_TOKEN:-change-me}
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:-change-me}
      VAULT_URL: http://mcp-secrets:4112
      VAULT_SERVICE_TOKEN: ${VAULT_SERVICE_TOKEN:-change-me}
      KNOWLEDGE_INTERNAL_URL: http://mcp-knowledge:4119
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8080"
  frontend:
    image: melnikovit/mcp-team-hub-frontend:latest
    restart: unless-stopped
    expose:
      - "80"
  orchestrator:
    image: melnikovit/mcp-team-hub-orchestrator:latest
    environment:
      HTTP_ADDR: ":8090"
      ORCHESTRATOR_API_TOKEN: ${ORCHESTRATOR_API_TOKEN:-change-me}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    expose:
      - "8090"
  gateway:
    image: melnikovit/mcp-team-hub-gateway:latest
    ports:
      - "${GATEWAY_PORT:-4300}:4300"
    environment:
      HTTP_ADDR: ":4300"
      FRONTEND_URL: http://frontend:80
      API_URL: http://api:8080
      ORCHESTRATOR_URL: http://orchestrator:8090
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:-change-me}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:4300}
      KNOWLEDGE_INTERNAL_URL: http://mcp-knowledge:4119
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:-change-me}
    depends_on:
      - api
      - frontend
      - orchestrator
      - mcp-secrets
    restart: unless-stopped

volumes:
  pgdata:

