# mcp-team-hub — public deploy template
# Pulls images from Docker Hub: melnikovit/mcp-team-hub-*
# Configure secrets via .env (see .env.example). Do not commit real credentials.
# UI / API / MCP entry: http://localhost:${GATEWAY_PORT:-4300}

services:
  postgres:
    image: pgvector/pgvector:pg16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-mcp_admin}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-mcp_admin}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./deploy/searxng:/etc/searxng:ro
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    restart: unless-stopped
    expose:
      - "8080"
  mcp-secrets:
    image: melnikovit/mcp-team-hub-mcp-secrets:latest
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-mcp_admin}
      VAULT_URL: http://mcp-secrets:4112
    restart: unless-stopped
  mcp-web-search:
